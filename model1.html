<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Model</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: url('image.jpg') no-repeat center center/cover;
            color: #fff;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .box {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 195, 255, 0.2);
            max-width: 900px;
            width: 90%;
            position: relative;
            z-index: 2;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ff9800;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.5);
        }

        .back-button {
            background: #1e1e1e;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #b46f08;
            color: #000;
        }

        h2 {
            border-bottom: 2px solid #ff9800;
            padding-bottom: 5px;
        }

        .log-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ff9800;
            margin-bottom: 20px;
        }

        .log-content {
            max-height: 450px;
            overflow-y: auto;
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .worker-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .worker-log {
            flex: 1;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <button class="back-button" onclick="history.back()">&#8592; Back</button>
            <h1>DML Model 1 - CNN</h1>
        </div>

        <h2>Master Node Logs</h2>
        <div class="log-container">
            <div id="masterLogs" class="log-content">Loading...</div>
        </div>
<!-- 
        <h2>Worker Logs</h2>
        <div id="workerLogs" class="worker-container"></div> -->
    </div>

    <script>
        let noChangeCount = 0;
        let maxNoChangeCount = 5;
        let previousLogs = {};

        async function fetchLog(fileName, elementId) {
            try {
                let response = await fetch(fileName);
                let text = await response.text();

                let logElement = document.getElementById(elementId);
                if (previousLogs[elementId] === text) {
                    noChangeCount++;
                } else {
                    noChangeCount = 0;
                }

                previousLogs[elementId] = text;
                logElement.innerText = text;
            } catch (error) {
                document.getElementById(elementId).innerText = "Error loading logs...";
            }
        }
        

        // async function loadWorkerLogs() {
        //     const workerLogsContainer = document.getElementById("workerLogs");
        //     workerLogsContainer.innerHTML = "";

        //     let workerPorts = [4000, 4001];
        //     workerPorts.forEach(port => {
        //         let workerDiv = document.createElement("div");
        //         workerDiv.className = "log-container worker-log";
        //         workerDiv.innerHTML = `<h3>Worker ${port}</h3><div id="worker_${port}" class="log-content">Loading...</div>`;
        //         workerLogsContainer.appendChild(workerDiv);

        //         fetchLog(`worker_${port}.txt`, `worker_${port}`);
        //     });
        // }

        function refreshLogs() {
            fetchLog("master.txt", "masterLogs");
            loadWorkerLogs();

            if (noChangeCount >= maxNoChangeCount) {
                clearInterval(refreshInterval);
                console.log("Logs haven't changed, stopping refresh.");
            }
        }

        let refreshInterval = setInterval(refreshLogs, 2000);
        refreshLogs();
    </script>
</body>
</html>
