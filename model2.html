<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DML Model 2</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: url('image.jpg') no-repeat center center/cover;
            color: #fff;
            /* text-align: center; */
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .box {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.3);
            max-width: 900px;
            width: 90%;
            position: relative;
            z-index: 2;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2196F3;
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.5);
        }

        .back-button {
            background: #1e1e1e;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #0f4c7e;
            color: #000;
        }

        h2 {
            border-bottom: 2px solid #00ff95;
            padding-bottom: 5px;
        }

        .log-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.5);
            margin-bottom: 20px;
        }

        .log-content {
            max-height: 250px;
            overflow-y: auto;
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="header">
            <button class="back-button" onclick="history.back()">&#8592; Back</button>
            <h1>DML Model 2 - Linear Regression</h1>
        </div>

        <h2>Master Node Logs</h2>
        <div class="log-container">
            <div id="masterLogs" class="log-content">Loading...</div>
        </div>
    </div>

    <script>
        async function fetchMasterLogs() {
            try {
                let response = await fetch("master_a.txt");
                let text = await response.text();
                document.getElementById("masterLogs").innerText = text;
            } catch (error) {
                document.getElementById("masterLogs").innerText = "Error loading logs...";
            }
        }

        setInterval(fetchMasterLogs, 2000);
        fetchMasterLogs();
    </script>
</body>
</html>
